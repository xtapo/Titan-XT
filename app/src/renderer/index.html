<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titan-XT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/global.css" />
  <link rel="stylesheet" href="./styles/home.css" />
  <link rel="stylesheet" href="./styles/session.css" />
  <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
  <header id="titlebar">
    <div class="titlebar-drag">
      <div class="titlebar-icon">◆</div>
      <span class="titlebar-title">TITAN-XT</span>
    </div>
    <div class="titlebar-controls">
      <button id="btn-minimize" class="titlebar-btn">─</button>
      <button id="btn-maximize" class="titlebar-btn">□</button>
      <button id="btn-close" class="titlebar-btn btn-close">✕</button>
    </div>
  </header>

  <main id="app">
    <nav id="app-tabs" class="app-tabs">
      <button class="app-tab active" data-page="home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h4v-7h4v7h4a1 1 0 001-1V10"/>
        </svg>
        Trang chủ
      </button>
      <button class="app-tab" data-page="address-book">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Máy của tôi
      </button>
    </nav>
    <div id="page-home" class="page active"></div>
    <div id="page-address-book" class="page"></div>
    <div id="page-session" class="page"></div>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
