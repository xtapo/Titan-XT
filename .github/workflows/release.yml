# Build Titan-XT installer + auto-publish to GitHub Releases.
#
# Trigger: push a version tag like v1.0.0. The job syncs app/package.json
# `version` with the tag, builds the installer per OS, and lets
# electron-builder publish to a GitHub Release of that tag (it auto-creates
# the release as a draft on the first matrix runner and then uploads to
# the same release from the others).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # required to create releases + upload assets

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pin package.json version to the tag so electron-builder names files
      # Titan-XT-Setup-<version>.exe and the GitHub release matches the tag.
      # Skipped on workflow_dispatch (no tag context).
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Setting version to $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Build + publish (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      - name: Build + publish (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code-signing — skip silently if secrets not set.
          CSC_LINK: ${{ secrets.MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: npm run build && npx electron-builder --mac --publish always

      - name: Build + publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --linux --publish always
