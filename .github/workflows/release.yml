# Build Titan-XT installers + auto-publish to GitHub Releases.
#
# Trigger: push a version tag like v1.0.0. Each job syncs app/package.json
# `version` with the tag, builds for its OS, and lets electron-builder
# publish to a GitHub Release of that tag.
#
# macOS: built unsigned. End-users will see Gatekeeper warnings until a
# Developer ID cert is wired up via CSC_LINK / CSC_KEY_PASSWORD secrets.
# Linux: not built here yet — add a job when there's demand.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # required to create releases + upload assets

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pin package.json version to the tag so electron-builder names files
      # Titan-XT-Setup-<version>.exe and the GitHub release matches the tag.
      # Skipped on workflow_dispatch (no tag context).
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Setting version to $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Build + publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

  macos:
    runs-on: macos-latest
    # Serialize after windows. electron-builder's `--publish always` uses the
    # GitHub Releases API (create-or-update by tag), and running both jobs in
    # parallel can race: the second job to "create" the release sometimes
    # wipes the assets the first one already uploaded. Sequential is slower
    # by ~5 min but produces a release with both Windows + macOS assets.
    needs: windows

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Setting version to $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      - run: npm ci

      # Unsigned build. CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
      # from attempting to look up a missing keychain identity (which fails the
      # job). Set CSC_LINK + CSC_KEY_PASSWORD repo secrets to enable signing.
      - name: Build + publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release:mac
