# Build Titan-XT installer + auto-publish to GitHub Releases.
#
# Trigger: push a version tag like v1.0.0. The job syncs app/package.json
# `version` with the tag, builds the Windows installer, and lets
# electron-builder publish to a GitHub Release of that tag.
#
# Mac/Linux: not built here. Mac requires a code-signing cert (otherwise
# the .app is "damaged" warning); Linux rpm/snap targets need extra system
# packages on the runner. Add them back when those secrets / targets are
# actually needed.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # required to create releases + upload assets

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pin package.json version to the tag so electron-builder names files
      # Titan-XT-Setup-<version>.exe and the GitHub release matches the tag.
      # Skipped on workflow_dispatch (no tag context).
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Setting version to $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Build + publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win
